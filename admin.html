<!doctype html><html lang="ckb" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ئیمان شێخانی - ژووری بەڕێوبەر</title><link rel="stylesheet" href="style.css"><body><main>
<section id="login" class="card"><div class="ico">🔐</div><h1>ئیمان شێخانی - ژووری بەڕێوبەر</h1><input id="code" type="password" placeholder="کۆدی تایبەت"><button onclick="login()">چوونەژوورەوە</button><p id="err"></p></section>
