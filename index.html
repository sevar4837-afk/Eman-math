<!doctype html><html lang="ckb" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ئیمان شێخانی - تاقیکردنەوەی بیرکاری</title><link rel="stylesheet" href="style.css"><body><main>
<section id="start" class="card"><div class="ico">🧮</div><h1>ئیمان شێخانی - تاقیکردنەوەی بیرکاری</h1><input id="name" placeholder="ناوی قوتابی"><button onclick="start()">دەستپێکردن 🚀</button></section>
<section id="quiz" class="card hide"><div class="top"><b id="num"></b><b id="clock"></b></div><div class="bar"><i id="bar"></i></div><h2 id="q"></h2><div id="ans"></div><button id="next" disabled onclick="next()">دواتر ➜</button></section>
<section id="result" class="card hide"><div class="ico">🏆</div><h1>ئەنجام</h1><div id="out"></div><button onclick="location.reload()">دووبارە تاقیکردنەوە</button></section>
</main><script src="app.js"></script></body></html>
